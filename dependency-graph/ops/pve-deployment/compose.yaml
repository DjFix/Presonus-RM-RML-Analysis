# DHCP lease .190; reserve MAC BC:24:11:05:8C:06 before production cutover.
services:
  memgraph:
    image: memgraph/memgraph-mage:3.13.0@sha256:cc33431b088c6b9580528d8d5aff92f3b958de1af5d40126f831ab8512eb855a
    command: ["--memory-limit=16384", "--storage-mode=IN_MEMORY_TRANSACTIONAL"]
    restart: unless-stopped
    mem_limit: 18g
    ports:
      - "192.168.50.190:7687:7687"
      - "192.168.50.190:7444:7444"
    volumes:
      - /srv/memgraph/data:/var/lib/memgraph
      - /srv/memgraph/log:/var/log/memgraph
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
  lab:
    image: memgraph/lab:3.13.2@sha256:c6c205e240ac27b09d75877788650f5ff1d4c640b0a96af27dcc6e06ce25620c
    restart: unless-stopped
    mem_limit: 1g
    depends_on: [memgraph]
    ports:
      - "192.168.50.190:3000:3000"
    environment:
      QUICK_CONNECT_MG_HOST: memgraph
      QUICK_CONNECT_MG_PORT: "7687"
      LOG_REQUEST_BODY_IS_ENABLED: "false"
      LOG_RESPONSE_BODY_IS_ENABLED: "false"
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}
